<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System using BST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Management System</h1>
    <p>Using Binary Search Tree (BST)</p>
</header>

<div class="container">

    <section class="card">
        <h2>Add New Contact</h2>

        <input type="number" id="contactId" placeholder="Contact ID">
        <input type="text" id="name" placeholder="Full Name">
        <input type="tel" id="phone" placeholder="Mobile Number">
        <input type="email" id="email" placeholder="Email Address">
        <textarea id="address" placeholder="Address"></textarea>

        <button onclick="addContact()">Add Contact</button>
    </section>

    <section class="card">
        <h2>Search Contact</h2>
        <input type="number" id="searchId" placeholder="Enter Contact ID">
        <button onclick="searchContact()">Search</button>
        <div id="searchResult"></div>
    </section>

    <section class="card">
        <h2>Delete Contact</h2>
        <input type="number" id="deleteId" placeholder="Enter Contact ID">
        <button onclick="deleteContact()">Delete Contact</button>
    </section>

    <section class="card">
        <h2>All Contacts</h2>
        <button onclick="displayContacts()">Display Contacts (Inorder)</button>
        <button onclick="findMinimum()">Minimum ID</button>
        <button onclick="findMaximum()">Maximum ID</button>
        <div id="contactList"></div>
    </section>

    <section class="card">
        <h2>BST Information</h2>
        <p>Data Structure: Binary Search Tree</p>
        <p>Key: Contact ID</p>
        <p>Traversal: Inorder Traversal</p>
        <p id="totalContacts">Total Contacts: 0</p>
    </section>

</div>

<footer>
    <p>Contact Management System | BST Mini Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
